<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1E1035" />
      <stop offset="60%" stop-color="#090514" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    
    <!-- Neon Violet to Fuchsia Brand Gradient -->
    <linearGradient id="gaanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="45%" stop-color="#8B5CF6" />
      <stop offset="85%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#D946EF" />
    </linearGradient>

    <!-- Glowing Accent -->
    <linearGradient id="soundGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- AMOLED Background -->
  <rect width="512" height="512" rx="112" fill="#000000" />
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />

  <!-- Outer Neon Wave Ring Accent -->
  <circle cx="256" cy="256" r="190" stroke="url(#gaanGrad)" stroke-width="4" stroke-opacity="0.3" fill="none" stroke-dasharray="12 16" />

  <!-- Core 'G' Sonic Wave Glyph -->
  <g filter="url(#neonBlur)">
    <!-- Main Outer Arc forming G -->
    <path d="M 330 160 C 290 120 220 120 175 160 C 130 205 130 285 175 330 C 220 375 295 375 336 330 C 352 312 360 290 360 264 L 256 264" 
          fill="none" 
          stroke="url(#gaanGrad)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Equalizer Sound Wave Bars inside the G center -->
    <rect x="220" y="220" width="12" height="40" rx="6" fill="url(#gaanGrad)" />
    <rect x="242" y="196" width="12" height="64" rx="6" fill="#C084FC" />
    <rect x="264" y="210" width="12" height="50" rx="6" fill="url(#gaanGrad)" />
    <rect x="286" y="228" width="12" height="32" rx="6" fill="#A855F7" />

    <!-- Pulsing Center Orb -->
    <circle cx="360" cy="264" r="8" fill="#F472B6" />
  </g>
</svg>
